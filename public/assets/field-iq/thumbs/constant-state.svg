<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" fill="none" role="img" aria-label="KV cache grows with length. Delta state stays O(1).">
  <defs>
    <linearGradient id="cs-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0C0A0B"/>
      <stop offset="100%" stop-color="#12080C"/>
    </linearGradient>
    <linearGradient id="cs-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9F1239" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FB7185" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cs-const" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0891B2" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#cs-bg)"/>

  <!-- Header -->
  <text x="40" y="38" fill="#FDA4AF" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="700" letter-spacing="0.28em">STATE · VS LENGTH</text>

  <!-- ZONE: growing KV -->
  <text x="40" y="72" fill="#FB7185" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="700" letter-spacing="0.2em">KV CACHE</text>
  <text x="600" y="72" text-anchor="end" fill="rgba(253,164,175,0.45)" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="600">length →</text>

  <rect x="40" y="88" width="100" height="28" fill="url(#cs-bar)" opacity="0.45"/>
  <rect x="40" y="126" width="190" height="28" fill="url(#cs-bar)" opacity="0.6"/>
  <rect x="40" y="164" width="310" height="28" fill="url(#cs-bar)" opacity="0.78"/>
  <rect x="40" y="202" width="460" height="28" fill="url(#cs-bar)"/>

  <!-- Divider -->
  <line x1="40" y1="252" x2="600" y2="252" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- ZONE: constant delta -->
  <text x="40" y="284" fill="#67E8F9" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="700" letter-spacing="0.2em">DELTA STATE</text>
  <rect x="40" y="298" width="200" height="36" fill="url(#cs-const)"/>
  <text x="260" y="326" fill="#FFFFFF" font-size="48" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="800" letter-spacing="-0.04em">O(1)</text>
  <text x="400" y="320" fill="rgba(103,232,249,0.55)" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="500">fixed size · every length</text>

  <!-- Footer -->
  <line x1="40" y1="356" x2="600" y2="356" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="40" y="382" fill="rgba(255,255,255,0.42)" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="500">Class fact. Not a serving win.</text>
  <text x="600" y="382" text-anchor="end" fill="rgba(103,232,249,0.4)" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="600">Kimi 6× is theirs*</text>
</svg>

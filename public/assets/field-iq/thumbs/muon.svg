<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" fill="none" role="img" aria-label="Muon cut lab T-star about 3.5 times versus AdamW.">
  <defs>
    <linearGradient id="mu-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06140F"/>
      <stop offset="100%" stop-color="#0A1F18"/>
    </linearGradient>
    <linearGradient id="mu-win" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#mu-bg)"/>

  <!-- Header -->
  <text x="40" y="38" fill="#6EE7B7" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="700" letter-spacing="0.28em">MUON</text>
  <text x="118" y="38" fill="rgba(110,231,183,0.4)" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="600" letter-spacing="0.14em">OPTIMIZER · NOT MIXER</text>

  <!-- ZONE: race tracks -->
  <text x="40" y="78" fill="rgba(255,255,255,0.35)" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="600" letter-spacing="0.12em">TIME TO THRESHOLD</text>

  <!-- AdamW row -->
  <text x="40" y="118" fill="rgba(255,255,255,0.45)" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="600">AdamW</text>
  <rect x="120" y="102" width="360" height="22" rx="11" fill="rgba(255,255,255,0.08)"/>
  <rect x="120" y="102" width="360" height="22" rx="11" fill="rgba(255,255,255,0.16)"/>
  <text x="500" y="118" fill="rgba(255,255,255,0.4)" font-size="14" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="700">~5500</text>

  <!-- Muon row -->
  <text x="40" y="168" fill="#6EE7B7" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="600">Muon</text>
  <rect x="120" y="152" width="360" height="22" rx="11" fill="rgba(52,211,153,0.1)"/>
  <rect x="120" y="152" width="105" height="22" rx="11" fill="url(#mu-win)"/>
  <text x="500" y="168" fill="#6EE7B7" font-size="14" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="700">~1600</text>

  <line x1="40" y1="200" x2="600" y2="200" stroke="rgba(255,255,255,0.1)"/>

  <!-- ZONE: result -->
  <text x="40" y="270" fill="#ECFDF5" font-size="72" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="900" letter-spacing="-0.05em">3.5×</text>
  <text x="240" y="248" fill="rgba(110,231,183,0.75)" font-size="16" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="600">faster to threshold</text>
  <text x="240" y="274" fill="rgba(255,255,255,0.35)" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif">lab stack · memorization extraction</text>

  <!-- Footer -->
  <line x1="40" y1="310" x2="600" y2="310" stroke="rgba(255,255,255,0.1)"/>
  <text x="40" y="342" fill="rgba(167,243,208,0.5)" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif">g_coh stayed flat near 0.31</text>
  <text x="40" y="372" fill="rgba(255,255,255,0.32)" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif">Moonshot ~2× FLOP is a different claim</text>
</svg>

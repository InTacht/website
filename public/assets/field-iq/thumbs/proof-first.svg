<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" fill="none" role="img" aria-label="Proof filter. Theorem kept. Analogy killed.">
  <defs>
    <linearGradient id="pf-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#120808"/>
      <stop offset="100%" stop-color="#0C1210"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#pf-bg)"/>

  <!-- Header -->
  <text x="40" y="38" fill="#FCA5A5" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="700" letter-spacing="0.28em">PROOF FILTER</text>

  <!-- Left column: KILLED -->
  <rect x="40" y="60" width="260" height="250" fill="rgba(239,68,68,0.06)" stroke="rgba(239,68,68,0.2)" stroke-width="1"/>
  <text x="60" y="92" fill="#F87171" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="700" letter-spacing="0.22em">KILLED</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="60" y="140" fill="rgba(252,165,165,0.75)" font-size="18" font-weight="600">Diagonal / holo</text>
    <line x1="58" y1="132" x2="230" y2="132" stroke="#EF4444" stroke-width="2.5"/>

    <text x="60" y="190" fill="rgba(252,165,165,0.65)" font-size="18" font-weight="600">FFT-as-invention</text>
    <line x1="58" y1="182" x2="250" y2="182" stroke="#EF4444" stroke-width="2.5"/>

    <text x="60" y="240" fill="rgba(252,165,165,0.55)" font-size="18" font-weight="600">Analogy slots</text>
    <line x1="58" y1="232" x2="220" y2="232" stroke="#EF4444" stroke-width="2.5"/>
  </g>

  <text x="60" y="286" fill="rgba(248,113,113,0.45)" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif">no theorem · no keep</text>

  <!-- Right column: KEPT -->
  <rect x="340" y="60" width="260" height="250" fill="rgba(52,211,153,0.06)" stroke="rgba(52,211,153,0.28)" stroke-width="1"/>
  <text x="360" y="92" fill="#34D399" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="700" letter-spacing="0.22em">KEPT</text>

  <text x="360" y="170" fill="#FFFFFF" font-size="28" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="800">Matrix-delta</text>
  <text x="360" y="210" fill="#6EE7B7" font-size="28" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="800">/ GDN</text>
  <text x="360" y="260" fill="rgba(110,231,183,0.55)" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif">published state · audited</text>
  <text x="360" y="286" fill="rgba(110,231,183,0.45)" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif">theorem-backed path</text>

  <!-- Footer -->
  <line x1="40" y1="336" x2="600" y2="336" stroke="rgba(255,255,255,0.1)"/>
  <text x="40" y="370" fill="rgba(255,255,255,0.42)" font-size="14" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="500">Theorem survived. Analogy died.</text>
</svg>

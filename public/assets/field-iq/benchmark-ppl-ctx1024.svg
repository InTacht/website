<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" fill="none" role="img" aria-label="Perplexity at context 1024. GDN-class memory at 2.82 beats Transformer++ at 2.99. Lower is better.">
  <defs>
    <radialGradient id="ppl-glow" cx="68%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.30"/>
      <stop offset="45%" stop-color="#6366F1" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#0B0C12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ppl-vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0.15"/>
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.48"/>
    </linearGradient>
    <linearGradient id="ppl-bar-win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A5B4FC" stop-opacity="1"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="ppl-bar-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.38)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.14)"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="#0B0C12"/>
  <rect width="640" height="400" fill="url(#ppl-glow)"/>
  <rect width="640" height="400" fill="url(#ppl-vignette)"/>

  <!-- Eyebrow -->
  <text x="36" y="48" fill="rgba(255,255,255,0.45)" font-size="14" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-weight="600" letter-spacing="0.28em">PPL</text>
  <text x="90" y="48" fill="rgba(255,255,255,0.28)" font-size="14" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-weight="500" letter-spacing="0.08em">· CTX 1024 · 3 SEEDS</text>

  <!-- Baseline -->
  <line x1="48" y1="318" x2="380" y2="318" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>

  <!-- Transformer++ bar (higher PPL = taller, muted) -->
  <rect x="78" y="128" width="100" height="190" fill="url(#ppl-bar-base)"/>
  <text x="128" y="116" text-anchor="middle" fill="rgba(255,255,255,0.55)" font-size="22" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-weight="700" letter-spacing="-0.02em">2.99</text>
  <text x="128" y="348" text-anchor="middle" fill="rgba(255,255,255,0.38)" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-weight="600" letter-spacing="0.08em">T++</text>

  <!-- GDN-class bar (lower PPL = shorter, indigo) -->
  <rect x="230" y="178" width="100" height="140" fill="url(#ppl-bar-win)"/>
  <text x="280" y="166" text-anchor="middle" fill="#FFFFFF" font-size="22" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-weight="700" letter-spacing="-0.02em">2.82</text>
  <text x="280" y="348" text-anchor="middle" fill="rgba(165,180,252,0.85)" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-weight="600" letter-spacing="0.08em">GDN</text>

  <!-- Delta callout between bars -->
  <text x="204" y="248" text-anchor="middle" fill="#A5B4FC" font-size="13" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-weight="700" letter-spacing="-0.01em">−0.17</text>

  <!-- Punch line -->
  <text x="36" y="372" fill="rgba(255,255,255,0.55)" font-size="15" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-weight="500" letter-spacing="-0.01em">Lower is better. Matched params. Every seed.</text>

  <!-- Hero score block -->
  <g transform="translate(420 96)">
    <text x="0" y="0" fill="rgba(165,180,252,0.9)" font-size="13" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-weight="600" letter-spacing="0.18em">GDN-CLASS</text>
    <text x="0" y="78" fill="#FFFFFF" font-size="78" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-weight="700" letter-spacing="-0.04em">2.82</text>
    <line x1="0" y1="108" x2="180" y2="108" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
    <text x="0" y="140" fill="rgba(255,255,255,0.38)" font-size="13" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-weight="600" letter-spacing="0.16em">TRANSFORMER++</text>
    <text x="0" y="196" fill="rgba(255,255,255,0.55)" font-size="46" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-weight="700" letter-spacing="-0.03em">2.99</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" fill="none" role="img" aria-label="Consumer GPU die for lab training.">
  <defs>
    <linearGradient id="gpu-bg" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#07090F"/>
      <stop offset="55%" stop-color="#0B0E16"/>
      <stop offset="100%" stop-color="#05060A"/>
    </linearGradient>
    <linearGradient id="gpu-board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141922"/>
      <stop offset="45%" stop-color="#0E121A"/>
      <stop offset="100%" stop-color="#090B11"/>
    </linearGradient>
    <linearGradient id="gpu-lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A3140"/>
      <stop offset="40%" stop-color="#171C27"/>
      <stop offset="100%" stop-color="#0C0F16"/>
    </linearGradient>
    <linearGradient id="gpu-die" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A2430"/>
      <stop offset="100%" stop-color="#0A1018"/>
    </linearGradient>
    <linearGradient id="gpu-sm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9BE015"/>
      <stop offset="100%" stop-color="#76B900"/>
    </linearGradient>
    <radialGradient id="gpu-glow" cx="50%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#76B900" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#76B900" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#76B900" stop-opacity="0"/>
    </radialGradient>
    <filter id="gpu-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.65"/>
    </filter>
    <filter id="gpu-bloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="640" height="400" fill="url(#gpu-bg)"/>
  <rect width="640" height="400" fill="url(#gpu-glow)"/>

  <!-- faint PCB traces -->
  <g stroke="rgba(118,185,0,0.08)" stroke-width="1">
    <path d="M40 80 H180 M40 120 H140 M40 160 H160 M500 80 H600 M520 120 H600 M480 160 H600"/>
    <path d="M80 320 H220 M60 350 H180 M420 320 H580 M460 350 H600"/>
  </g>

  <!-- PCB board -->
  <g filter="url(#gpu-soft)">
    <rect x="96" y="72" width="448" height="256" rx="18" fill="url(#gpu-board)" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
  </g>
  <rect x="108" y="84" width="424" height="232" rx="12" fill="rgba(255,255,255,0.015)" stroke="rgba(255,255,255,0.06)"/>

  <!-- edge connectors / pins -->
  <g fill="rgba(210,216,230,0.42)">
    <!-- left -->
    <rect x="78" y="112" width="18" height="5" rx="1"/><rect x="78" y="128" width="18" height="5" rx="1"/>
    <rect x="78" y="144" width="18" height="5" rx="1"/><rect x="78" y="160" width="18" height="5" rx="1"/>
    <rect x="78" y="176" width="18" height="5" rx="1"/><rect x="78" y="192" width="18" height="5" rx="1"/>
    <rect x="78" y="208" width="18" height="5" rx="1"/><rect x="78" y="224" width="18" height="5" rx="1"/>
    <rect x="78" y="240" width="18" height="5" rx="1"/><rect x="78" y="256" width="18" height="5" rx="1"/>
    <!-- right -->
    <rect x="544" y="112" width="18" height="5" rx="1"/><rect x="544" y="128" width="18" height="5" rx="1"/>
    <rect x="544" y="144" width="18" height="5" rx="1"/><rect x="544" y="160" width="18" height="5" rx="1"/>
    <rect x="544" y="176" width="18" height="5" rx="1"/><rect x="544" y="192" width="18" height="5" rx="1"/>
    <rect x="544" y="208" width="18" height="5" rx="1"/><rect x="544" y="224" width="18" height="5" rx="1"/>
    <rect x="544" y="240" width="18" height="5" rx="1"/><rect x="544" y="256" width="18" height="5" rx="1"/>
    <!-- top -->
    <rect x="150" y="54" width="5" height="18" rx="1"/><rect x="170" y="54" width="5" height="18" rx="1"/>
    <rect x="190" y="54" width="5" height="18" rx="1"/><rect x="210" y="54" width="5" height="18" rx="1"/>
    <rect x="230" y="54" width="5" height="18" rx="1"/><rect x="250" y="54" width="5" height="18" rx="1"/>
    <rect x="270" y="54" width="5" height="18" rx="1"/><rect x="290" y="54" width="5" height="18" rx="1"/>
    <rect x="310" y="54" width="5" height="18" rx="1"/><rect x="330" y="54" width="5" height="18" rx="1"/>
    <rect x="350" y="54" width="5" height="18" rx="1"/><rect x="370" y="54" width="5" height="18" rx="1"/>
    <rect x="390" y="54" width="5" height="18" rx="1"/><rect x="410" y="54" width="5" height="18" rx="1"/>
    <rect x="430" y="54" width="5" height="18" rx="1"/><rect x="450" y="54" width="5" height="18" rx="1"/>
    <rect x="470" y="54" width="5" height="18" rx="1"/><rect x="490" y="54" width="5" height="18" rx="1"/>
    <!-- bottom -->
    <rect x="150" y="328" width="5" height="18" rx="1"/><rect x="170" y="328" width="5" height="18" rx="1"/>
    <rect x="190" y="328" width="5" height="18" rx="1"/><rect x="210" y="328" width="5" height="18" rx="1"/>
    <rect x="230" y="328" width="5" height="18" rx="1"/><rect x="250" y="328" width="5" height="18" rx="1"/>
    <rect x="270" y="328" width="5" height="18" rx="1"/><rect x="290" y="328" width="5" height="18" rx="1"/>
    <rect x="310" y="328" width="5" height="18" rx="1"/><rect x="330" y="328" width="5" height="18" rx="1"/>
    <rect x="350" y="328" width="5" height="18" rx="1"/><rect x="370" y="328" width="5" height="18" rx="1"/>
    <rect x="390" y="328" width="5" height="18" rx="1"/><rect x="410" y="328" width="5" height="18" rx="1"/>
    <rect x="430" y="328" width="5" height="18" rx="1"/><rect x="450" y="328" width="5" height="18" rx="1"/>
    <rect x="470" y="328" width="5" height="18" rx="1"/><rect x="490" y="328" width="5" height="18" rx="1"/>
  </g>

  <!-- GDDR memory modules -->
  <g>
    <rect x="128" y="118" width="52" height="164" rx="6" fill="#12161F" stroke="rgba(255,255,255,0.12)"/>
    <rect x="136" y="130" width="36" height="28" rx="3" fill="#1B2230" stroke="rgba(118,185,0,0.25)"/>
    <rect x="136" y="168" width="36" height="28" rx="3" fill="#1B2230" stroke="rgba(118,185,0,0.2)"/>
    <rect x="136" y="206" width="36" height="28" rx="3" fill="#1B2230" stroke="rgba(118,185,0,0.25)"/>
    <rect x="136" y="244" width="36" height="28" rx="3" fill="#1B2230" stroke="rgba(118,185,0,0.18)"/>
    <text x="154" y="304" text-anchor="middle" fill="rgba(255,255,255,0.28)" font-size="8" font-family="ui-sans-serif, system-ui, sans-serif" letter-spacing="0.14em">GDDR</text>

    <rect x="460" y="118" width="52" height="164" rx="6" fill="#12161F" stroke="rgba(255,255,255,0.12)"/>
    <rect x="468" y="130" width="36" height="28" rx="3" fill="#1B2230" stroke="rgba(118,185,0,0.25)"/>
    <rect x="468" y="168" width="36" height="28" rx="3" fill="#1B2230" stroke="rgba(118,185,0,0.2)"/>
    <rect x="468" y="206" width="36" height="28" rx="3" fill="#1B2230" stroke="rgba(118,185,0,0.25)"/>
    <rect x="468" y="244" width="36" height="28" rx="3" fill="#1B2230" stroke="rgba(118,185,0,0.18)"/>
    <text x="486" y="304" text-anchor="middle" fill="rgba(255,255,255,0.28)" font-size="8" font-family="ui-sans-serif, system-ui, sans-serif" letter-spacing="0.14em">GDDR</text>
  </g>

  <!-- central heat spreader / package -->
  <rect x="204" y="108" width="232" height="184" rx="14" fill="url(#gpu-lid)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <rect x="214" y="118" width="212" height="164" rx="10" fill="url(#gpu-die)" stroke="rgba(255,255,255,0.1)"/>

  <!-- SM tile grid -->
  <g>
    <!-- row 1 -->
    <rect x="228" y="132" width="28" height="22" rx="3" fill="rgba(118,185,0,0.08)" stroke="rgba(118,185,0,0.22)"/>
    <rect x="262" y="132" width="28" height="22" rx="3" fill="rgba(118,185,0,0.16)" stroke="rgba(118,185,0,0.4)"/>
    <rect x="296" y="132" width="28" height="22" rx="3" fill="rgba(118,185,0,0.1)" stroke="rgba(118,185,0,0.28)"/>
    <rect x="330" y="132" width="28" height="22" rx="3" fill="rgba(118,185,0,0.2)" stroke="rgba(118,185,0,0.45)"/>
    <rect x="364" y="132" width="28" height="22" rx="3" fill="rgba(118,185,0,0.08)" stroke="rgba(118,185,0,0.22)"/>
    <!-- row 2 -->
    <rect x="228" y="160" width="28" height="22" rx="3" fill="rgba(118,185,0,0.14)" stroke="rgba(118,185,0,0.35)"/>
    <rect x="262" y="160" width="28" height="22" rx="3" fill="rgba(118,185,0,0.09)" stroke="rgba(118,185,0,0.25)"/>
    <rect x="296" y="160" width="28" height="22" rx="3" fill="url(#gpu-sm)" fill-opacity="0.55" stroke="#9BE015" stroke-opacity="0.85" filter="url(#gpu-bloom)"/>
    <rect x="330" y="160" width="28" height="22" rx="3" fill="rgba(118,185,0,0.12)" stroke="rgba(118,185,0,0.3)"/>
    <rect x="364" y="160" width="28" height="22" rx="3" fill="rgba(118,185,0,0.18)" stroke="rgba(118,185,0,0.42)"/>
    <!-- row 3 -->
    <rect x="228" y="188" width="28" height="22" rx="3" fill="rgba(118,185,0,0.1)" stroke="rgba(118,185,0,0.26)"/>
    <rect x="262" y="188" width="28" height="22" rx="3" fill="rgba(118,185,0,0.22)" stroke="rgba(118,185,0,0.5)"/>
    <rect x="296" y="188" width="28" height="22" rx="3" fill="rgba(118,185,0,0.15)" stroke="rgba(118,185,0,0.38)"/>
    <rect x="330" y="188" width="28" height="22" rx="3" fill="url(#gpu-sm)" fill-opacity="0.42" stroke="#9BE015" stroke-opacity="0.7"/>
    <rect x="364" y="188" width="28" height="22" rx="3" fill="rgba(118,185,0,0.09)" stroke="rgba(118,185,0,0.24)"/>
    <!-- row 4 -->
    <rect x="228" y="216" width="28" height="22" rx="3" fill="rgba(118,185,0,0.17)" stroke="rgba(118,185,0,0.4)"/>
    <rect x="262" y="216" width="28" height="22" rx="3" fill="rgba(118,185,0,0.08)" stroke="rgba(118,185,0,0.22)"/>
    <rect x="296" y="216" width="28" height="22" rx="3" fill="rgba(118,185,0,0.2)" stroke="rgba(118,185,0,0.46)"/>
    <rect x="330" y="216" width="28" height="22" rx="3" fill="rgba(118,185,0,0.11)" stroke="rgba(118,185,0,0.28)"/>
    <rect x="364" y="216" width="28" height="22" rx="3" fill="rgba(118,185,0,0.14)" stroke="rgba(118,185,0,0.34)"/>
  </g>

  <!-- center label plate -->
  <rect x="268" y="248" width="104" height="26" rx="6" fill="rgba(8,10,14,0.72)" stroke="rgba(118,185,0,0.45)"/>
  <text x="320" y="265" text-anchor="middle" fill="#ECFDF5" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="700" letter-spacing="0.22em">GPU DIE</text>

  <!-- status LEDs -->
  <circle cx="228" y="261" r="3.5" fill="#76B900" filter="url(#gpu-bloom)"/>
  <circle cx="412" y="261" r="3.5" fill="#76B900" fill-opacity="0.45"/>
</svg>
